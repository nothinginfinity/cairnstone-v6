name = "cairnstone-v6"
main = "src/index.js"
compatibility_date = "2026-06-21"
keep_vars = true

[vars]
CAIRNSTONE_BOOTSTRAP_DEFAULT_MODE = "optimized_sparse"

[observability]
enabled = true

[ai]
binding = "AI"

# Shared vault/graph/workspace/AC1 D1 (unchanged).
[[d1_databases]]
binding = "CAIRNSTONE_DB"
database_name = "cairnstone-v6"
database_id = "7c4ae99e-4ab0-44c3-afa3-3f1a2d64d319"
migrations_dir = "migrations"

# Dedicated auth D1 (V7.7.10i.1a). database_id is a PLACEHOLDER until Jared runs:
#   npx wrangler d1 create cairnstone-v6-auth
# then replaces PLACEHOLDER_CREATE_cairnstone-v6-auth with the returned UUID.
# Do NOT substitute the shared cairnstone-v6 database_id here.
[[d1_databases]]
binding = "CAIRNSTONE_AUTH_DB"
database_name = "cairnstone-v6-auth"
database_id = "fcd0437e-0b48-4f70-ac59-9d8f6a475aa2"
migrations_dir = "migrations/auth"

[[r2_buckets]]
binding = "CAIRNSTONE_RAW"
bucket_name = "cairnstone-v6-raw"
