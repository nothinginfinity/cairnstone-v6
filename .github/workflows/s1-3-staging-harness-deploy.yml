# SAFETY: STAGING ONLY, manual dispatch only, from main, owner-reviewed environment `s1-3-staging`.
# Deploys ONLY the Worker `cairnstone-stage-harness` from the exact main commit this workflow runs from (no arbitrary source commits).
# phase=dormant (default): deploys the harness with STAGE_C_HARNESS_ENABLED=false (404 on every path). phase=enable additionally needs the
# owner phrase, all three owner-provisioned secrets, and an Access-restricted custom hostname that equals the config's issuer host.
# Redeploying phase=dormant is the rollback: the file itself never enables the harness; `enable` is a deploy-time --var only.
# No routes, no workers.dev, no secrets set or printed, no production binding. Fails closed while the auth D1 id is not pinned (placeholder
# all-zero ids are rejected). The Cloudflare token is step-scoped: never exposed to checkout, install, config verification, tests or dry-run.
name: S1-3 isolated Stage C harness deploy (manual only, STAGING ONLY)

on:
  workflow_dispatch:
    inputs:
      confirm_stage_only:
        description: "Enter DEPLOY_ISOLATED_S1_3_STAGE_HARNESS"
        required: true
        type: string
      source_sha:
        description: "Full 40-char SHA; must equal the commit this workflow runs from (main)"
        required: true
        type: string
      phase:
        description: "dormant (default, harness disabled) or enable (harness enabled; needs enable_confirm)"
        required: true
        type: choice
        default: dormant
        options:
          - dormant
          - enable
      enable_confirm:
        description: "Only for phase=enable: enter ENABLE_S1_3_STAGEC_HARNESS_FOR_OWNER_RUN"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  staging-harness:
    if: ${{ github.event.inputs.confirm_stage_only == 'DEPLOY_ISOLATED_S1_3_STAGE_HARNESS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: s1-3-staging
    concurrency:
      group: s1-3-staging-activation
      cancel-in-progress: false
    env:
      SOURCE_SHA: ${{ github.event.inputs.source_sha }}
      PHASE: ${{ github.event.inputs.phase }}
      ENABLE_CONFIRM: ${{ github.event.inputs.enable_confirm }}
      LOCKFILE_SHA256: b131afd4a9e16c5d595162f742878e9904b87ec3f8df9f9e058132b61ece63b9
      PACKAGE_JSON_SHA256: 8705ba1ad3914ac526c64acd37f48e9b9af34caf5dd5279d76e8607dbb8e2593
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_sha must be a full 40-char lowercase SHA"; exit 1; }
          test "$SOURCE_SHA" = "$GITHUB_SHA" || { echo "::error::source_sha must equal the commit this workflow runs from"; exit 1; }
          test "${GITHUB_REF_NAME}" = "main" || { echo "::error::must be dispatched from main"; exit 1; }
          [[ "$PHASE" == "dormant" || "$PHASE" == "enable" ]] || { echo "::error::phase must be dormant or enable"; exit 1; }
          if [ "$PHASE" = "enable" ]; then test "$ENABLE_CONFIRM" = "ENABLE_S1_3_STAGEC_HARNESS_FOR_OWNER_RUN" || { echo "::error::enable requires the owner phrase"; exit 1; }; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin source, lockfile and package manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(sha256sum package.json | cut -d' ' -f1)" = "$PACKAGE_JSON_SHA256" || { echo "::error::package.json differs from the reviewed manifest"; exit 1; }
          test "$(sha256sum deploy/s1-3-staging/package-lock.json | cut -d' ' -f1)" = "$LOCKFILE_SHA256" || { echo "::error::lockfile differs from the reviewed lockfile"; exit 1; }
          test ! -e package-lock.json || { echo "::error::source tree unexpectedly carries its own lockfile; review and re-pin"; exit 1; }
          cp deploy/s1-3-staging/package-lock.json package-lock.json
      - name: Verify harness config is exactly the reviewed, fully pinned identity (no credentials)
        run: node scripts/staging/s1-3-activation.mjs verify-harness-config wrangler.stagec-harness.toml --mode "$PHASE"
      - name: Install dependencies from lockfile (no scripts, no credentials)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Harness gates (syntax, core, auth store, activation; no credentials)
        run: |
          node --check src/staging-gateway/stagec-harness-worker.js
          node --check src/staging-gateway/stagec-harness-core.js
          node --test test/staging-auth-store.test.js test/staging-gateway-worker.test.js test/s1-3-stagec-integration.test.js test/s1-3-activation.test.js test/s1-3-activation-workflow-invariants.test.js
      - name: Preflight live staging (auth D1, private Worker, harness state) BEFORE deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/staging/s1-3-activation.mjs harness-preflight --mode "$PHASE" --harness-toml wrangler.stagec-harness.toml --receipt "$RUNNER_TEMP/s1-3-harness-preflight-receipt.json"
      - name: Validate Cloudflare bundle, dormant (no deploy, no credentials)
        if: ${{ github.event.inputs.phase == 'dormant' }}
        run: npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/s1-3-harness-build" --config wrangler.stagec-harness.toml
      - name: Validate Cloudflare bundle, enable (no deploy, no credentials)
        if: ${{ github.event.inputs.phase == 'enable' }}
        run: npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/s1-3-harness-build" --config wrangler.stagec-harness.toml --var STAGE_C_HARNESS_ENABLED:true
      - name: Deploy isolated Stage C harness Worker ONLY (dormant)
        if: ${{ github.event.inputs.phase == 'dormant' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy --config wrangler.stagec-harness.toml --tag "s1-3-harness-${SOURCE_SHA:0:12}" --message "S1-3 harness dormant ${SOURCE_SHA} run ${GITHUB_RUN_ID}"
      - name: Deploy isolated Stage C harness Worker ONLY (enable)
        if: ${{ github.event.inputs.phase == 'enable' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy --config wrangler.stagec-harness.toml --var STAGE_C_HARNESS_ENABLED:true --tag "s1-3-harness-${SOURCE_SHA:0:12}" --message "S1-3 harness ENABLED ${SOURCE_SHA} run ${GITHUB_RUN_ID}"
      - name: Live readback (bindings, secret names, exposure)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/staging/s1-3-activation.mjs harness-readback --mode "$PHASE" --harness-toml wrangler.stagec-harness.toml --receipt "$RUNNER_TEMP/s1-3-harness-readback-receipt.json"
      - name: Write run summary (no secrets)
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## S1-3 Stage C harness deploy (STAGING ONLY, phase=$PHASE)"
            echo "- worker: \`cairnstone-stage-harness\` @ \`$SOURCE_SHA\` (run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT)"
            for f in s1-3-harness-preflight-receipt s1-3-harness-readback-receipt; do
              if [ -f "$RUNNER_TEMP/$f.json" ]; then echo "- $f: ok=$(jq -r .ok "$RUNNER_TEMP/$f.json")"; else echo "- $f: not produced"; fi
            done
            if [ "$PHASE" = "dormant" ]; then echo "- harness is DISABLED (404 everywhere). Next: owner provisions the three secrets, an Access-restricted hostname, pins a non-placeholder issuer in a reviewed PR, then phase=enable."; else echo "- harness is ENABLED for the owner-dispatched Stage C run; redeploy phase=dormant to disable."; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload receipts (no secrets)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: s1-3-harness-deploy-receipts-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/s1-3-harness-preflight-receipt.json
            ${{ runner.temp }}/s1-3-harness-readback-receipt.json
          if-no-files-found: warn
