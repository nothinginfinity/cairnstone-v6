name: S1-3 staging D1 recreate (manual only, STAGING ONLY)

# Creates a NEW empty staging D1, applies migrations/private-staging (0001+0002), verifies parity, and
# prints the new database id. Does NOT touch the old staging DB, any Worker, R2, production resource,
# secret, route, or repo file. Owner then updates wrangler.private-staging.toml in a reviewed PR.

on:
  workflow_dispatch:
    inputs:
      confirm_stage_only:
        description: "Enter RECREATE_ISOLATED_S1_3_STAGE_D1"
        required: true
        type: string
      source_sha:
        description: "Full 40-char commit SHA containing migrations/private-staging 0001+0002"
        required: true
        type: string

permissions:
  contents: read

jobs:
  recreate-staging-d1:
    if: ${{ github.event.inputs.confirm_stage_only == 'RECREATE_ISOLATED_S1_3_STAGE_D1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: s1-3-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_SHA: ${{ github.event.inputs.source_sha }}
      NEW_DB_NAME: cairnstone-private-staging-2
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "source_sha must be a full 40-char lowercase SHA"; exit 1; }
          test "${GITHUB_REF_NAME}" = "main"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned source and migration set
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          ls migrations/private-staging
          test "$(ls migrations/private-staging | wc -l)" = "2"
          test -f migrations/private-staging/0001_private_realm.sql
          test -f migrations/private-staging/0002_parity_role_and_authz_triggers.sql
          test -f test/private-staging-schema-parity.test.js
          # Guard: never reference production resources.
          ! grep -REq '7c4ae99e-4ab0-44c3-afa3-3f1a2d64d319|fcd0437e-0b48-4f70-ac59-9d8f6a475aa2|cairnstone-v6-raw' migrations/private-staging
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Offline schema parity gate (staging migrations vs canonical S0b-2)
        run: node --test test/private-staging-schema-parity.test.js test/private-staging-core.test.js
      - name: Refuse if target DB name already exists
        shell: bash
        run: |
          set -euo pipefail
          resp=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=$NEW_DB_NAME")
          echo "$resp" | jq -e '.success == true' >/dev/null || { echo "Cloudflare D1 list failed"; echo "$resp" | jq '{success,errors}'; exit 1; }
          n=$(echo "$resp" | jq --arg n "$NEW_DB_NAME" '[.result[] | select(.name == $n)] | length')
          test "$n" = "0" || { echo "Database $NEW_DB_NAME already exists; refusing."; exit 1; }
      - name: Create new staging D1
        id: create
        shell: bash
        run: |
          set -euo pipefail
          resp=$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" \
            --data "{\"name\":\"$NEW_DB_NAME\"}")
          echo "$resp" | jq -e '.success == true' >/dev/null || { echo "Create failed"; echo "$resp" | jq '{success,errors}'; exit 1; }
          id=$(echo "$resp" | jq -r '.result.uuid')
          [[ "$id" =~ ^[0-9a-f-]{36}$ ]] || { echo "unexpected id"; exit 1; }
          test "$id" != "26d4e786-2da7-47a4-a159-1ba206712b13"
          echo "db_id=$id" >> "$GITHUB_OUTPUT"
      - name: Apply migrations 0001 + 0002 to the NEW database only
        shell: bash
        env:
          NEW_DB_ID: ${{ steps.create.outputs.db_id }}
        run: |
          set -euo pipefail
          cat > /tmp/wrangler.recreate.toml <<TOML
          name = "s1-3-d1-recreate-tool-not-deployed"
          compatibility_date = "2026-06-21"
          [[d1_databases]]
          binding = "CAIRNSTONE_PRIVATE_DB"
          database_name = "$NEW_DB_NAME"
          database_id = "$NEW_DB_ID"
          migrations_dir = "$GITHUB_WORKSPACE/migrations/private-staging"
          TOML
          npx wrangler d1 migrations apply CAIRNSTONE_PRIVATE_DB --remote --config /tmp/wrangler.recreate.toml
      - name: Read-only verification of the new schema
        shell: bash
        env:
          NEW_DB_ID: ${{ steps.create.outputs.db_id }}
        run: |
          set -euo pipefail
          q() { npx wrangler d1 execute CAIRNSTONE_PRIVATE_DB --remote --config /tmp/wrangler.recreate.toml --json --command "$1"; }
          trg=$(q "SELECT name FROM sqlite_master WHERE type='trigger' AND name IN ('priv_messages_sender_authorized','priv_deliveries_target_authorized')")
          test "$(echo "$trg" | jq '[.[0].results[]] | length')" = "2"
          role=$(q "SELECT name FROM pragma_table_info('priv_home_connections') WHERE name='role'")
          test "$(echo "$role" | jq '[.[0].results[]] | length')" = "1"
          nonce=$(q "SELECT name FROM sqlite_master WHERE type='table' AND name='priv_service_nonces'")
          test "$(echo "$nonce" | jq '[.[0].results[]] | length')" = "1"
          rows=$(q "SELECT COUNT(*) AS n FROM priv_homes")
          test "$(echo "$rows" | jq '.[0].results[0].n')" = "0"
          {
            echo "## S1-3 staging D1 recreated (STAGING ONLY)"
            echo "- new database name: \`$NEW_DB_NAME\`"
            echo "- new database_id: \`$NEW_DB_ID\`"
            echo "- source commit: \`$SOURCE_SHA\`"
            echo "- verified: role column, sender/delivery authorization triggers, priv_service_nonces, empty data"
            echo "- old staging DB untouched; no Worker deployed; wrangler.private-staging.toml NOT changed"
          } >> "$GITHUB_STEP_SUMMARY"
