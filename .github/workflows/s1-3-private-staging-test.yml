name: S1-3 private staging source gate (no deploy)
on:
  push:
    branches:
      - chatgpt/s1-3-private-staging
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Isolated staging syntax gate
        run: node --check src/private-realm/private-staging-core.js && node --check src/private-realm/private-staging-worker.js
      - name: Stage-specific negative tests
        run: node --test test/private-staging-core.test.js
      - name: Full existing regression gate
        run: npm run check
      - name: Explicit guard - never deploy
        run: echo "SOURCE TEST ONLY; NO CLOUDFLARE CHANGES"
