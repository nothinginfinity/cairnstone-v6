name: PR77 S1-1 draft test gate (no deploy)

on:
  push:
    branches:
      - chatgpt/s1-1-identity-home-bridge
  pull_request:
    branches:
      - grok/s0b2-private-persistence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Node 22 identity bridge regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Full syntax, skill and test gate (TEST ONLY)
        run: npm run check
