# SAFETY: Only exact reviewed S1-3 candidate may be deployed. Update ALLOWED_SOURCE_SHA in a separately reviewed PR.
# Cloudflare credentials are step-scoped: never exposed to checkout, installation, or tests.
name: S1-3 isolated private staging deploy v2 (manual only, STAGING ONLY)

# Deploys ONLY the Worker `cairnstone-private-staging` from a pinned, reviewed commit, bound to the
# recreated staging D1 (cairnstone-private-staging-2). No routes, no workers.dev, no production resources.
# Does not set or print secrets (PRIVATE_GATEWAY_HMAC_KEY is managed separately and persists across deploys).

on:
  workflow_dispatch:
    inputs:
      confirm_stage_only:
        description: "Enter DEPLOY_ISOLATED_S1_3_STAGE_V2"
        required: true
        type: string
      source_sha:
        description: "Full 40-char commit SHA to deploy (must be reviewed; config must target the recreated D1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  isolated-staging-v2:
    if: ${{ github.event.inputs.confirm_stage_only == 'DEPLOY_ISOLATED_S1_3_STAGE_V2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: s1-3-staging
    env:
      SOURCE_SHA: ${{ github.event.inputs.source_sha }}
      ALLOWED_SOURCE_SHA: bec2e2e8f0287ac1ff84280344166f1f1d9b9fb0
      EXPECTED_DB_ID: 9420f645-4bdf-430f-a790-feb34d01f077
      OLD_DB_ID: 26d4e786-2da7-47a4-a159-1ba206712b13
      WORKER_NAME: cairnstone-private-staging
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "source_sha must be a full 40-char lowercase SHA"; exit 1; }
          test "$SOURCE_SHA" = "$ALLOWED_SOURCE_SHA" || { echo "::error::Source commit is not the pinned reviewed S1-3 candidate"; exit 1; }
          test "${GITHUB_REF_NAME}" = "main"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin source and prevent production/old targets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          f=wrangler.private-staging.toml
          test -f "$f"
          grep -Fxq 'name = "cairnstone-private-staging"' $f
          grep -Fxq 'workers_dev = false' $f
          grep -Fxq 'preview_urls = false' $f
          grep -Fxq "database_id = \"$EXPECTED_DB_ID\"" $f
          grep -Fxq 'database_name = "cairnstone-private-staging-2"' $f
          grep -Fxq 'bucket_name = "cairnstone-private-staging"' $f
          grep -Fxq 'PRIVATE_STAGE_CALLER = "cairnstone-stage-gateway"' $f
          ! grep -q "$OLD_DB_ID" $f
          ! grep -Eq '7c4ae99e-4ab0-44c3-afa3-3f1a2d64d319|fcd0437e-0b48-4f70-ac59-9d8f6a475aa2|cairnstone-v6-raw' $f
          ! grep -Eq '^\[\[routes\]\]|^routes|^route ' $f
          test "$(ls migrations/private-staging | wc -l)" = "2"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Staging gates (syntax, core, schema parity)
        run: |
          node --check src/private-realm/private-staging-core.js
          node --check src/private-realm/private-staging-worker.js
          node --test test/private-staging-core.test.js test/private-staging-schema-parity.test.js test/private-realm-worker.test.js
      - name: Verify target D1 schema live (read-only) before deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          resp=$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$EXPECTED_DB_ID/query" \
            --data "{\"sql\":\"SELECT name FROM sqlite_master WHERE type='trigger' AND name IN ('priv_messages_sender_authorized','priv_deliveries_target_authorized')\"}")
          echo "$resp" | jq -e '.success == true and ([.result[0].results[]] | length) == 2' >/dev/null || { echo "target D1 missing authorization triggers"; exit 1; }
      - name: Validate Cloudflare bundle (no deploy)
        run: npx wrangler deploy --dry-run --outdir /tmp/s1-3-stage-build --config wrangler.private-staging.toml
      - name: Deploy isolated private staging Worker ONLY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.private-staging.toml
      - name: Live readback (bindings, no public exposure)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME"
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          settings=$(curl -sS -H "$H" "$base/settings")
          echo "$settings" | jq -e '.success == true' >/dev/null
          echo "$settings" | jq -e --arg id "$EXPECTED_DB_ID" '[.result.bindings[] | select(.type=="d1") | .id] == [$id]' >/dev/null || { echo "unexpected D1 binding"; exit 1; }
          echo "$settings" | jq -e '[.result.bindings[] | select(.type=="r2_bucket") | .bucket_name] == ["cairnstone-private-staging"]' >/dev/null || { echo "unexpected R2 binding"; exit 1; }
          sub=$(curl -sS -H "$H" "$base/subdomain")
          echo "$sub" | jq -e '.result.enabled == false and (.result.previews_enabled // false) == false' >/dev/null || { echo "workers.dev/preview exposure is enabled"; exit 1; }
          sec=$(curl -sS -H "$H" "$base/secrets")
          has_key=$(echo "$sec" | jq '[.result[]? | select(.name=="PRIVATE_GATEWAY_HMAC_KEY")] | length')
          {
            echo "## S1-3 staging Worker deployed (STAGING ONLY)"
            echo "- worker: \`$WORKER_NAME\` @ \`$SOURCE_SHA\`"
            echo "- D1 binding id: \`$EXPECTED_DB_ID\` (readback OK); R2: cairnstone-private-staging"
            echo "- workers.dev and previews disabled (readback OK)"
            echo "- PRIVATE_GATEWAY_HMAC_KEY secret present: $has_key (value never read)"
            echo "- gateway service binding must set props.caller = cairnstone-stage-gateway"
          } >> "$GITHUB_STEP_SUMMARY"
