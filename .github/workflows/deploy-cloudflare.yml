          CHECKPOINT="capture_before"
          before="$(curl -fsS "$BASE/v2/chains/$CHAIN/resume")"
          before_head="$(echo "$before" | jq -r '.canonical_head.hash')"
          roadmap_head="$(echo "$before" | jq -r '.path_heads[] | select(.path == "docs/ROADMAP_V7.md") | .stone_hash')"
          before_paths="$(echo "$before" | jq -c '.path_heads | map({path,stone_hash}) | sort_by(.path)')"
          path_count="$(echo "$before" | jq -r '.path_heads | length')"
          test -n "$before_head"
          test -n "$roadmap_head"
          test "$path_count" -gt 2

          CHECKPOINT="legacy_bootstrap"
          legacy_payload="$(jq -nc --arg task "$TASK" --arg chain "$CHAIN" '{jsonrpc:"2.0",id:7611,method:"tools/call",params:{name:"cairnstone_agent_bootstrap",arguments:{actor_id:"github-actions:v761-acceptance",task:$task,chain:$chain,mode:"legacy_full",include_inbox:false,include_profile:true}}}')"
          legacy_outer="$(curl -fsS -X POST "$RPC" -H 'content-type: application/json' -H 'accept: application/json' --data "$legacy_payload")"
          legacy="$(echo "$legacy_outer" | jq -c '.result.content[0].text | fromjson')"
          echo "$legacy" | jq -c '{checkpoint:"legacy_bootstrap",ok,error,package_id,chain_head:.authority.chain_head.stone_hash,path_head_count:(.authority.path_heads|length),sparse:(.authority.sparse//null),limits,authority_bytes:(.diagnostics.bootstrap_package.sections.authority_bytes//null)}'
          CHECKPOINT="legacy_assert"
          echo "$legacy" | jq -e --arg head "$before_head" --argjson count "$path_count" '
            .ok == true and
            .schema == "cairnstone-agent-context-v1" and
            .authority.chain_head.stone_hash == $head and
            (.authority.path_heads | length) == $count and
            (.authority | has("sparse") | not) and
            .policy.accepted_state_only_for_authority == true and
            .policy.execution_authority == false and
            .policy.mutation_authority == false and
            .diagnostics.bootstrap_package.ok == true
          ' >/dev/null

          CHECKPOINT="sparse_bootstrap"
          sparse_payload="$(jq -nc --arg task "$TASK" --arg chain "$CHAIN" '{jsonrpc:"2.0",id:7612,method:"tools/call",params:{name:"cairnstone_agent_bootstrap",arguments:{actor_id:"github-actions:v761-acceptance",task:$task,chain:$chain,mode:"optimized_sparse",include_inbox:false,include_profile:true}}}')"
          sparse_outer="$(curl -fsS -X POST "$RPC" -H 'content-type: application/json' -H 'accept: application/json' --data "$sparse_payload")"
          sparse="$(echo "$sparse_outer" | jq -c '.result.content[0].text | fromjson')"
          echo "$sparse" | jq -c '{checkpoint:"sparse_bootstrap",ok,error,package_id,chain_head:.authority.chain_head.stone_hash,path_head_count:(.authority.path_heads|length),selected_paths:[.authority.path_heads[].path],sparse:(.authority.sparse//null),limits,authority_bytes:(.diagnostics.bootstrap_package.sections.authority_bytes//null)}'
          CHECKPOINT="sparse_assert"
          echo "$sparse" | jq -e --arg head "$before_head" --arg roadmap "$roadmap_head" --argjson count "$path_count" --argjson legacy_bytes "$(echo "$legacy" | jq '.limits.package_bytes')" --argjson legacy_authority_bytes "$(echo "$legacy" | jq '.diagnostics.bootstrap_package.sections.authority_bytes')" '
            .ok == true and
            .schema == "cairnstone-agent-context-v1" and
            .authority.chain_head.stone_hash == $head and
            .authority.sparse.schema == "cairnstone-sparse-authority-v1" and
            .authority.sparse.mode == "optimized_sparse" and
            (.authority.sparse.authority_manifest_id | test("^sha256:[0-9a-f]{64}$")) and
            (.authority.sparse.path_heads_digest | test("^sha256:[0-9a-f]{64}$")) and
            .authority.sparse.full_path_head_count == $count and
            .authority.sparse.represented_path_head_count == (.authority.path_heads | length) and
            .authority.sparse.omitted_path_head_count == ($count - (.authority.path_heads | length)) and
            .authority.sparse.omitted_path_head_count > 0 and
            (.authority.path_heads | length) < $count and
            any(.authority.path_heads[]; .path == "docs/AI_OPERATING_GUIDE.md") and
            any(.authority.path_heads[]; .path == "docs/ROADMAP_V7.md" and .stone_hash == $roadmap) and
            .authority.sparse.expansion.tool == "cairnstone_resume_chain" and
            .authority.sparse.expansion.expected_path_heads_digest == .authority.sparse.path_heads_digest and
            .limits.package_bytes < $legacy_bytes and
            .diagnostics.bootstrap_package.sections.authority_bytes < $legacy_authority_bytes and
            .policy.accepted_state_only_for_authority == true and
            .policy.execution_authority == false and
            .policy.mutation_authority == false
          ' >/dev/null

          echo "$sparse" | jq -c --argjson legacy "$legacy" '{checkpoint:"semantic_parity",instructions_equal:(.instructions==$legacy.instructions),skills_equal:(.skills==$legacy.skills),memory_equal:(.memory==$legacy.memory),legacy_memory_items:($legacy.memory.items|length),sparse_memory_items:(.memory.items|length),legacy_memory_truncated:$legacy.memory.truncated,sparse_memory_truncated:.memory.truncated,capabilities_equal:(.capabilities==$legacy.capabilities),policy_equal:(.policy==$legacy.policy),chain_head_equal:(.authority.chain_head==$legacy.authority.chain_head)}'
          # V7.6.4 intentionally allows optimized_sparse to transmit the
          # accepted runtime brief while legacy_full transmits the full guide.
          # V7.6.1 parity therefore means identical canonical instruction
          # authority identity, not identical transmitted representation.
          CHECKPOINT="parity_instruction_authority"
          echo "$sparse" | jq -e --argjson legacy "$legacy" '
            .instructions.path == $legacy.instructions.path and
