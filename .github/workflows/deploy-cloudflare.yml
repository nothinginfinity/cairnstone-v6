name: Deploy CairnStone v6

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply D1 migrations before deploy"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      run_v621_acceptance:
        description: "Run V6.2.1 live correctness acceptance after deploy"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      run_v63_acceptance:
        description: "Run V6.3 live repository reconciliation acceptance after deploy"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      run_v610_acceptance:
        description: "Run V6.10 live Skills Sub-Agent acceptance after deploy"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      run_v72_acceptance:
        description: "Run V7.2 bounded read-only delegation live acceptance after deploy"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 280908cb4e54b81745740accf5f0500f
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Syntax and regression tests
        run: npm run check

      - name: Show Wrangler version
        run: npx wrangler --version

      - name: Apply D1 migrations
        if: github.event.inputs.apply_migrations == 'true'
        run: npx wrangler d1 migrations apply cairnstone-v6 --remote --config wrangler.toml

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.toml

      - name: V6.2.1 live correctness acceptance
        if: github.event.inputs.run_v621_acceptance == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://cairnstone-v6.jaredtechfit.workers.dev"

          health=""
          for attempt in {1..10}; do
            health="$(curl -fsS "$BASE/health" || true)"
            if echo "$health" | jq -e '.ok == true and .name == "cairnstone-v6" and ((.mcp_tools | index("cairnstone_set_path_head")) != null) and ((.mcp_tools | index("cairnstone_check_source_freshness")) != null)' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "$health" | jq -e '.ok == true and .name == "cairnstone-v6" and ((.mcp_tools | index("cairnstone_set_path_head")) != null) and ((.mcp_tools | index("cairnstone_check_source_freshness")) != null)' >/dev/null

          before="$(curl -fsS "$BASE/v2/chains/cairnstone-v6/manifest?detail=compact")"
          before_head="$(echo "$before" | jq -r '.head')"
          before_path="$(echo "$before" | jq -r '.path_heads[] | select(.path == "wrangler.toml") | .head')"
          test -n "$before_head"
          test -n "$before_path"

          fresh="$(curl -fsS -X POST "$BASE/v1/check-freshness" \
            -H 'content-type: application/json' \
            --data '{"chain":"cairnstone-v6","path":"wrangler.toml","owner":"nothinginfinity","repo":"cairnstone-v6","ref":"main"}')"
          echo "$fresh" | jq -e '.ok == true and .drift == false and ((.accepted.content_sha256 | type) == "string") and .accepted.content_sha256 == .observed.content_sha256 and .accepted.commit_sha != .observed.commit_sha' >/dev/null

          cached="$(curl -fsS -X POST "$BASE/v1/get-freshness" \
            -H 'content-type: application/json' \
            --data '{"chain":"cairnstone-v6","path":"wrangler.toml"}')"
          echo "$cached" | jq -e '.ok == true and .checked == true and .drift == false and .accepted.content_sha256 == .observed.content_sha256' >/dev/null

          after="$(curl -fsS "$BASE/v2/chains/cairnstone-v6/manifest?detail=compact")"
          after_head="$(echo "$after" | jq -r '.head')"
          after_path="$(echo "$after" | jq -r '.path_heads[] | select(.path == "wrangler.toml") | .head')"
          test "$before_head" = "$after_head"
          test "$before_path" = "$after_path"

          echo "V6.2.1 live acceptance passed: unchanged path stayed in_sync across unrelated repo commits and freshness check did not mutate chain/path HEAD."

      - name: V6.3 live repository reconciliation acceptance
        if: github.event.inputs.run_v63_acceptance == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://cairnstone-v6.jaredtechfit.workers.dev"

          health=""
          for attempt in {1..10}; do
            health="$(curl -fsS "$BASE/health" || true)"
            if echo "$health" | jq -e '.ok == true and .name == "cairnstone-v6" and ((.mcp_tools | index("cairnstone_reconcile_repo")) != null)' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "$health" | jq -e '.ok == true and .name == "cairnstone-v6" and ((.mcp_tools | index("cairnstone_reconcile_repo")) != null)' >/dev/null

          before="$(curl -fsS "$BASE/v2/chains/cairnstone-v6/manifest?detail=compact")"
          before_head="$(echo "$before" | jq -r '.head')"
          before_stones="$(echo "$before" | jq -r '.stones')"
          before_paths="$(echo "$before" | jq -c '.path_heads')"
          test -n "$before_head"
          test "$before_head" != "null"
          test -n "$before_paths"

          reconcile="$(curl -sS -X POST "$BASE/v1/reconcile-repo" \
            -H 'content-type: application/json' \
            --data '{"chain":"cairnstone-v6","owner":"nothinginfinity","repo":"cairnstone-v6","ref":"main","include_in_sync":true,"max_paths":5000}')"
          echo "$reconcile" | jq .

          echo "$reconcile" | jq -e '
            .ok == true and
            .repo == "nothinginfinity/cairnstone-v6" and
            .snapshot.immutable == true and
            .snapshot.tree_truncated == false and
            (.observed_commit_sha | test("^[0-9a-f]{40}$")) and
            .summary.in_sync >= 1 and
            .summary.added >= 1 and
            .read_only.chain_heads_written == false and
            .read_only.path_heads_written == false and
            .read_only.stones_written == false and
            (any(.tuples[]; .path == "wrangler.toml" and .drift_type == "in_sync" and (.current_stone_hash | type) == "string" and .accepted_blob_sha == .observed_blob_sha))
          ' >/dev/null

          after="$(curl -fsS "$BASE/v2/chains/cairnstone-v6/manifest?detail=compact")"
          after_head="$(echo "$after" | jq -r '.head')"
          after_stones="$(echo "$after" | jq -r '.stones')"
          after_paths="$(echo "$after" | jq -c '.path_heads')"
          test "$before_head" = "$after_head"
          test "$before_stones" = "$after_stones"
          test "$before_paths" = "$after_paths"

          echo "V6.3 live acceptance passed: one immutable repo snapshot classified added/in_sync paths and reconciliation left chain HEAD, every path HEAD, and stone count unchanged."

      - name: V6.10 live Skills Sub-Agent acceptance
        if: github.event.inputs.run_v610_acceptance == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://cairnstone-v6.jaredtechfit.workers.dev"

          health=""
          for attempt in {1..10}; do
            health="$(curl -fsS "$BASE/health" || true)"
            if echo "$health" | jq -e '.ok == true and .version == "0.4.8" and ((.mcp_tools | index("cairnstone_skill_agent")) != null)' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "$health" | jq -e '.ok == true and .version == "0.4.8" and ((.mcp_tools | index("cairnstone_skill_agent")) != null)' >/dev/null

          tools="$(curl -fsS -X POST "$BASE/mcp" -H 'content-type: application/json' -H 'accept: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}')"
          echo "$tools" | jq -e '.result.tools | any(.name == "cairnstone_skill_agent")' >/dev/null

          deterministic="$(curl -fsS -X POST "$BASE/mcp" -H 'content-type: application/json' -H 'accept: application/json' --data '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"cairnstone_skill_agent","arguments":{"task":"The GitHub Actions deployment failed. Find the failed workflow and inspect its jobs.","mode":"deterministic","max_skills":2}}}')"
          echo "$deterministic" | jq -e '
            (.result.content[0].text | fromjson) as $r |
            $r.ok == true and
            $r.selection_source == "deterministic" and
            $r.model_assist.used == false and
            $r.policy.accepted_state_only == true and
            $r.policy.execution_authority == false and
            $r.policy.mutation_authority == false and
            ($r.manifest.stone_hash | test("^[0-9a-f]{64}$"))
          ' >/dev/null

          assisted="$(curl -fsS -X POST "$BASE/mcp" -H 'content-type: application/json' -H 'accept: application/json' --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"cairnstone_skill_agent","arguments":{"task":"My pull request is blocked and I need to determine whether pull request state, branch protection, or required checks are responsible.","mode":"model","max_skills":2,"candidate_limit":5}}}')"
          echo "$assisted" | jq -e '
            (.result.content[0].text | fromjson) as $r |
            ($r.deterministic_candidates | map(.skill_id)) as $accepted |
            $r.ok == true and
            $r.selection_source == "model_assisted" and
            $r.model_assist.attempted == true and
            $r.model_assist.used == true and
            ($r.recommendations | length) >= 1 and
            all($r.recommendations[]; (.skill_id as $id | $accepted | index($id)) != null) and
            $r.policy.model_can_expand_candidate_set == false and
            $r.policy.model_can_select_unaccepted_skill == false and
            $r.policy.execution_authority == false and
            $r.policy.mutation_authority == false
          ' >/dev/null

          echo "V6.10 live acceptance passed: deterministic routing bypassed AI, ambiguous routing used the Skills Sub-Agent only inside accepted candidates, and no execution/mutation authority was granted."

      - name: V7.2 bounded read-only delegation live acceptance
        if: github.event.inputs.run_v72_acceptance == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://cairnstone-v6.jaredtechfit.workers.dev"

          health="$(curl -fsS "$BASE/health")"
          echo "$health" | jq -e '.ok == true and .version == "0.5.8" and ((.mcp_tools | index("cairnstone_delegate")) != null) and ((.mcp_tools | index("cairnstone_dispatch_handoff")) != null)' >/dev/null

          before="$(curl -fsS "$BASE/v2/chains/cairnstone-v6-project-memory/resume")"
          before_head="$(echo "$before" | jq -r '.canonical_head.hash')"
          before_paths="$(echo "$before" | jq -c '.path_heads | map({path,stone_hash}) | sort_by(.path)')"

          delegated="$(curl -fsS -X POST "$BASE/mcp" \
            -H 'content-type: application/json' \
            -H 'accept: application/json' \
            --data '{"jsonrpc":"2.0","id":72,"method":"tools/call","params":{"name":"cairnstone_delegate","arguments":{"actor_id":"github-actions:v72-acceptance","task":"Summarize the current accepted V7.2 project state in one short paragraph. Do not request or execute tools.","chain":"cairnstone-v6-project-memory","route":{"provider":"workers-ai","model":"@cf/meta/llama-3.3-70b-instruct-fp8-fast"},"generation":{"max_output_tokens":256,"temperature":0},"include_inbox":false}}}')"
          echo "$delegated" | jq -e '
            (.result.content[0].text | fromjson) as $r |
            $r.ok == true and
            $r.schema == "cairnstone-delegation-result-v1" and
            ($r.package_id | test("^sha256:[0-9a-f]{64}$")) and
            ($r.request_ir_id | test("^sha256:[0-9a-f]{64}$")) and
            $r.route.provider == "workers-ai" and
            $r.policy.delegation_mode == "read_only" and
            $r.policy.tools_exposed_to_model == 0 and
            $r.policy.tools_executed == 0 and
            $r.policy.execution_authority == false and
            $r.policy.mutation_authority == false and
            $r.policy.accepted_state_mutation == false and
            $r.diagnostics.context_package_returned == false and
            $r.diagnostics.server_carried_context_package == true and
            $r.diagnostics.external_model_calls >= 1 and
            (($r.observability.gateway_request_id | type) == "string")
          ' >/dev/null

          PACKAGE_ID="$(echo "$delegated" | jq -r '(.result.content[0].text | fromjson).package_id')"
          DISPATCH_ID="msg:v72-dispatch-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          dispatch_payload="$(jq -nc \
            --arg id "$DISPATCH_ID" \
            --arg package "$PACKAGE_ID" \
            --arg head "$before_head" \
            --arg commit "$GITHUB_SHA" \
            '{jsonrpc:"2.0",id:73,method:"tools/call",params:{name:"cairnstone_dispatch_handoff",arguments:{from:"github-actions:v72-acceptance",to:["github-actions:v72-inbox"],message_id:$id,thread_id:"v72-live-acceptance",subject:"V7.2 live handoff acceptance",priority:"normal",task:"Continue bounded V7.2 Console work.",chain:"cairnstone-v6-project-memory",package_id:$package,continuation_refs:[{stone_hash:$head,path:"project-memory/v72-read-only-delegation-live.md"}],github_artifact:{owner:"nothinginfinity",repo:"cairnstone-v6",path:"docs/ROADMAP_V7.md",commit_sha:$commit}}}}')"
          dispatched="$(curl -fsS -X POST "$BASE/mcp" -H 'content-type: application/json' -H 'accept: application/json' --data "$dispatch_payload")"
          echo "$dispatched" | jq -e --arg package "$PACKAGE_ID" --arg commit "$GITHUB_SHA" '
            (.result.content[0].text | fromjson) as $r |
            $r.ok == true and
            $r.idempotent_replay == false and
            $r.immutable_message_stone == true and
            $r.chain_head_written == false and
            $r.handoff.schema == "cairnstone-handoff-v1" and
            $r.handoff.package_id == $package and
            $r.handoff.continuation_ref_count == 1 and
            $r.handoff.github_artifact.commit_sha == $commit and
            $r.handoff.policy.transport_only == true and
            $r.handoff.policy.execution_authority == false and
            $r.handoff.policy.mutation_authority == false and
            $r.handoff.policy.accepted_state_authority == false
          ' >/dev/null

          replayed="$(curl -fsS -X POST "$BASE/mcp" -H 'content-type: application/json' -H 'accept: application/json' --data "$dispatch_payload")"
          echo "$replayed" | jq -e '(.result.content[0].text | fromjson) | .ok == true and .idempotent_replay == true' >/dev/null

          inbox_payload="$(jq -nc '{jsonrpc:"2.0",id:74,method:"tools/call",params:{name:"cairnstone_get_inbox",arguments:{recipient_id:"github-actions:v72-inbox",limit:50}}}')"
          inbox="$(curl -fsS -X POST "$BASE/mcp" -H 'content-type: application/json' -H 'accept: application/json' --data "$inbox_payload")"
          echo "$inbox" | jq -e --arg id "$DISPATCH_ID" '(.result.content[0].text | fromjson) as $r | any($r.messages[]; .message_id == $id and .intent == "handoff" and .status == "delivered")' >/dev/null

          read_payload="$(jq -nc --arg id "$DISPATCH_ID" '{jsonrpc:"2.0",id:75,method:"tools/call",params:{name:"cairnstone_read_message",arguments:{recipient_id:"github-actions:v72-inbox",message_id:$id}}}')"
          read_back="$(curl -fsS -X POST "$BASE/mcp" -H 'content-type: application/json' -H 'accept: application/json' --data "$read_payload")"
          echo "$read_back" | jq -e --arg package "$PACKAGE_ID" --arg commit "$GITHUB_SHA" '
            (.result.content[0].text | fromjson) as $r |
            ($r.content | fromjson) as $p |
            $r.ok == true and
            $r.immutable_message_stone == true and
            $r.mutation_scope == "delivery_state_only" and
            $p.schema == "cairnstone-handoff-v1" and
            $p.chain == "cairnstone-v6-project-memory" and
            $p.package_id == $package and
            ($p.continuation_refs | length) == 1 and
            $p.github_artifact.commit_sha == $commit and
            $p.policy.transport_only == true and
            $p.policy.execution_authority == false and
            $p.policy.mutation_authority == false and
            $p.policy.accepted_state_authority == false
          ' >/dev/null

          MIRROR_ID="msg:v72-github-mirror-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mirror_payload="$(jq -nc \
            --arg id "$MIRROR_ID" \
            --arg package "$PACKAGE_ID" \
            --arg head "$before_head" \
            --arg commit "$GITHUB_SHA" \
            '{jsonrpc:"2.0",id:76,method:"tools/call",params:{name:"cairnstone_dispatch_handoff",arguments:{from:"github-actions:v72-acceptance",to:["github-actions:v72-github-mirror"],message_id:$id,thread_id:"v72-live-acceptance",subject:"V7.2 GitHub inbox mirror acceptance",priority:"normal",task:"Verify the optional external GitHub inbox transport mirror without granting authority.",chain:"cairnstone-v6-project-memory",package_id:$package,continuation_refs:[{stone_hash:$head,path:"project-memory/v72-read-only-delegation-live.md"}],github_artifact:{owner:"nothinginfinity",repo:"cairnstone-v6",path:"docs/ROADMAP_V7.md",commit_sha:$commit},github_inbox:{owner:"nothinginfinity",repo:"cairnstone-v6-console",branch:"main",path_prefix:"cairnstone-inbox/v72-acceptance"}}}}')"
          mirrored="$(curl -fsS -X POST "$BASE/mcp" -H 'content-type: application/json' -H 'accept: application/json' --data "$mirror_payload")"
          echo "$mirrored" | jq -e '
            (.result.content[0].text | fromjson) as $r |
            $r.ok == true and
            $r.idempotent_replay == false and
            $r.immutable_message_stone == true and
            $r.handoff.github_inbox.owner == "nothinginfinity" and
            $r.handoff.github_inbox.repo == "cairnstone-v6-console" and
            $r.handoff.policy.external_mirror_authority == false and
            $r.github_inbox_mirror.ok == true and
            $r.github_inbox_mirror.schema == "cairnstone-github-inbox-mirror-v1" and
            $r.github_inbox_mirror.authority == "ac1_message_stone" and
            $r.github_inbox_mirror.ac1_stone_hash == $r.stone_hash and
            $r.github_inbox_mirror.ac1_message_preserved == true and
            $r.github_inbox_mirror.isolated == false and
            ($r.github_inbox_mirror.failures | length) == 0 and
            ($r.github_inbox_mirror.artifacts | length) == 1 and
            ($r.github_inbox_mirror.artifacts[0].commit_sha | test("^[0-9a-f]{40}$")) and
            ($r.github_inbox_mirror.artifacts[0].path | startswith("cairnstone-inbox/v72-acceptance/"))
          ' >/dev/null

          mirror_replayed="$(curl -fsS -X POST "$BASE/mcp" -H 'content-type: application/json' -H 'accept: application/json' --data "$mirror_payload")"
          echo "$mirror_replayed" | jq -e '
            (.result.content[0].text | fromjson) as $r |
            $r.ok == true and
            $r.idempotent_replay == true and
            $r.github_inbox_mirror.ok == true and
            ($r.github_inbox_mirror.artifacts | length) == 1 and
            $r.github_inbox_mirror.artifacts[0].idempotent_replay == true
          ' >/dev/null

          FAIL_ID="msg:v72-github-mirror-failure-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fail_payload="$(jq -nc \
            --arg id "$FAIL_ID" \
            --arg package "$PACKAGE_ID" \
            '{jsonrpc:"2.0",id:77,method:"tools/call",params:{name:"cairnstone_dispatch_handoff",arguments:{from:"github-actions:v72-acceptance",to:["github-actions:v72-mirror-failure"],message_id:$id,thread_id:"v72-live-acceptance",subject:"V7.2 GitHub inbox mirror failure isolation",priority:"normal",task:"Prove external mirror failure cannot roll back the immutable AC1 handoff.",chain:"cairnstone-v6-project-memory",package_id:$package,github_inbox:{owner:"nothinginfinity",repo:"cairnstone-v72-mirror-does-not-exist",branch:"main",path_prefix:"cairnstone-inbox/v72-acceptance"}}}}')"
          failed_mirror="$(curl -fsS -X POST "$BASE/mcp" -H 'content-type: application/json' -H 'accept: application/json' --data "$fail_payload")"
          echo "$failed_mirror" | jq -e '
            (.result.content[0].text | fromjson) as $r |
            $r.ok == true and
            $r.idempotent_replay == false and
            $r.immutable_message_stone == true and
            $r.handoff.policy.external_mirror_authority == false and
            $r.github_inbox_mirror.ok == false and
            $r.github_inbox_mirror.isolated == true and
            $r.github_inbox_mirror.ac1_message_preserved == true and
            $r.github_inbox_mirror.ac1_stone_hash == $r.stone_hash and
            ($r.github_inbox_mirror.failures | length) == 1
          ' >/dev/null

          failed_inbox_payload="$(jq -nc '{jsonrpc:"2.0",id:78,method:"tools/call",params:{name:"cairnstone_get_inbox",arguments:{recipient_id:"github-actions:v72-mirror-failure",limit:50}}}')"
          failed_inbox="$(curl -fsS -X POST "$BASE/mcp" -H 'content-type: application/json' -H 'accept: application/json' --data "$failed_inbox_payload")"
          echo "$failed_inbox" | jq -e --arg id "$FAIL_ID" '(.result.content[0].text | fromjson) as $r | any($r.messages[]; .message_id == $id and .intent == "handoff" and .status == "delivered")' >/dev/null

          after="$(curl -fsS "$BASE/v2/chains/cairnstone-v6-project-memory/resume")"
          after_head="$(echo "$after" | jq -r '.canonical_head.hash')"
          after_paths="$(echo "$after" | jq -c '.path_heads | map({path,stone_hash}) | sort_by(.path)')"
          test "$before_head" = "$after_head"
          test "$before_paths" = "$after_paths"

          echo "V7.2 live acceptance passed: Workers AI delegation, immutable AC1 dispatch/replay/read, successful external GitHub inbox mirroring, and mirror-failure isolation all succeeded while accepted chain/path state remained unchanged."
