          after_paths="$(echo "$after" | jq -c '.path_heads | map({path,stone_hash}) | sort_by(.path)')"
          test "$before_head" = "$after_head"
          test "$before_paths" = "$after_paths"

          echo "V7.6.4 live acceptance passed for the current acceptance phase: complete full-guide legacy behavior remained the default, optimized mode either failed safely to the accepted full guide or used the accepted identity-bound runtime brief, instruction-selection metadata was package-ID-bound, and accepted project state remained unchanged."

      - name: V7.6.2b native tool hydration live acceptance
