            $r.immutable_message_stone == true and
            $r.handoff.github_inbox.owner == "nothinginfinity" and
            $r.handoff.github_inbox.repo == "cairnstone-v6-console" and
            $r.handoff.policy.external_mirror_authority == false and
            $r.github_inbox_mirror.ok == true and
            $r.github_inbox_mirror.schema == "cairnstone-github-inbox-mirror-v1" and
            $r.github_inbox_mirror.authority == "ac1_message_stone" and
            $r.github_inbox_mirror.ac1_stone_hash == $r.stone_hash and
            $r.github_inbox_mirror.ac1_message_preserved == true and
            $r.github_inbox_mirror.isolated == false and
            ($r.github_inbox_mirror.failures | length) == 0 and
            ($r.github_inbox_mirror.artifacts | length) == 1 and
            ($r.github_inbox_mirror.artifacts[0].commit_sha | test("^[0-9a-f]{40}$")) and
            ($r.github_inbox_mirror.artifacts[0].path | startswith("cairnstone-inbox/v72-acceptance/"))
          ' >/dev/null

          mirror_replayed="$(curl -fsS -X POST "$BASE/mcp" -H 'content-type: application/json' -H 'accept: application/json' --data "$mirror_payload")"
          echo "$mirror_replayed" | jq -e '
            (.result.content[0].text | fromjson) as $r |
            $r.ok == true and
            $r.idempotent_replay == true and
            $r.github_inbox_mirror.ok == true and
            ($r.github_inbox_mirror.artifacts | length) == 1 and
            $r.github_inbox_mirror.artifacts[0].idempotent_replay == true
          ' >/dev/null

          FAIL_ID="msg:v72-github-mirror-failure-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fail_payload="$(jq -nc \
            --arg id "$FAIL_ID" \
            --arg package "$PACKAGE_ID" \
            '{jsonrpc:"2.0",id:77,method:"tools/call",params:{name:"cairnstone_dispatch_handoff",arguments:{from:"github-actions:v72-acceptance",to:["github-actions:v72-mirror-failure"],message_id:$id,thread_id:"v72-live-acceptance",subject:"V7.2 GitHub inbox mirror failure isolation",priority:"normal",task:"Prove external mirror failure cannot roll back the immutable AC1 handoff.",chain:"cairnstone-v6-project-memory",package_id:$package,github_inbox:{owner:"nothinginfinity",repo:"cairnstone-v72-mirror-does-not-exist",branch:"main",path_prefix:"cairnstone-inbox/v72-acceptance"}}}}')"
          failed_mirror="$(curl -fsS -X POST "$BASE/mcp" -H 'content-type: application/json' -H 'accept: application/json' --data "$fail_payload")"
          echo "$failed_mirror" | jq -e '
            (.result.content[0].text | fromjson) as $r |
            $r.ok == true and
            $r.idempotent_replay == false and
            $r.immutable_message_stone == true and
            $r.handoff.policy.external_mirror_authority == false and
            $r.github_inbox_mirror.ok == false and
            $r.github_inbox_mirror.isolated == true and
            $r.github_inbox_mirror.ac1_message_preserved == true and
            $r.github_inbox_mirror.ac1_stone_hash == $r.stone_hash and
            ($r.github_inbox_mirror.failures | length) == 1
          ' >/dev/null

          failed_inbox_payload="$(jq -nc '{jsonrpc:"2.0",id:78,method:"tools/call",params:{name:"cairnstone_get_inbox",arguments:{recipient_id:"github-actions:v72-mirror-failure",limit:50}}}')"
          failed_inbox="$(curl -fsS -X POST "$BASE/mcp" -H 'content-type: application/json' -H 'accept: application/json' --data "$failed_inbox_payload")"
          echo "$failed_inbox" | jq -e --arg id "$FAIL_ID" '(.result.content[0].text | fromjson) as $r | any($r.messages[]; .message_id == $id and .intent == "handoff" and .status == "delivered")' >/dev/null

          after="$(curl -fsS "$BASE/v2/chains/cairnstone-v6-project-memory/resume")"
          after_head="$(echo "$after" | jq -r '.canonical_head.hash')"
          after_paths="$(echo "$after" | jq -c '.path_heads | map({path,stone_hash}) | sort_by(.path)')"
          test "$before_head" = "$after_head"
          test "$before_paths" = "$after_paths"

          echo "V7.2 live acceptance passed: Workers AI delegation, immutable AC1 dispatch/replay/read, successful external GitHub inbox mirroring, and mirror-failure isolation all succeeded while accepted chain/path state remained unchanged."

      - name: V7.3.0 tool broker policy live acceptance
        if: github.event.inputs.run_v730_acceptance == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://cairnstone-v6.jaredtechfit.workers.dev"
          RPC="$BASE/mcp"

          health="$(curl -fsS "$BASE/health")"
          echo "$health" | jq -e '
            .ok == true and
            .version == "0.5.9" and
            ((.mcp_tools | index("cairnstone_tool_registry")) != null) and
            ((.mcp_tools | index("cairnstone_tool_policy_preview")) != null)
          ' >/dev/null

          before="$(curl -fsS "$BASE/v2/chains/cairnstone-v6-project-memory/resume")"
          before_head="$(echo "$before" | jq -r '.canonical_head.hash')"
          before_paths="$(echo "$before" | jq -c '.path_heads | map({path,stone_hash}) | sort_by(.path)')"

          tools="$(curl -fsS "$RPC")"
          echo "$tools" | jq -e '.tools | any(.name == "cairnstone_tool_registry") and any(.name == "cairnstone_tool_policy_preview")' >/dev/null

          registry_rpc='{"jsonrpc":"2.0","id":7301,"method":"tools/call","params":{"name":"cairnstone_tool_registry","arguments":{}}}'
          registry_outer="$(curl -fsS -X POST "$RPC" -H 'content-type: application/json' -H 'accept: application/json' --data "$registry_rpc")"
          registry="$(echo "$registry_outer" | jq -r '.result.content[0].text')"
          echo "$registry" | jq -e '
            .ok == true and
            .schema == "cairnstone-tool-registry-v1" and
            .authority == "operational_configuration" and
            .accepted_state_authority == false and
            .provider_credentials_in_registry == false and
            .external_model_calls == 0 and
            .tools_executed == 0 and
            .total == 12 and
            any(.tools[]; .tool_id == "cairnstone_health" and .risk_class == "read" and .authorization == "automatic") and
            any(.tools[]; .tool_id == "cairnstone_commit_v2" and .risk_class == "mutation" and .authorization == "human_confirmation")
          ' >/dev/null

          bootstrap_payload="$(jq -nc '{jsonrpc:"2.0",id:7302,method:"tools/call",params:{name:"cairnstone_agent_bootstrap",arguments:{actor_id:"github-actions:v730-acceptance",task:"Validate the V7.3.0 broker policy boundary without executing any requested tool.",chain:"cairnstone-v6-project-memory",capabilities:{tools:[{id:"cairnstone_health",available:true,class:"read"},{id:"cairnstone_commit_v2",available:true,class:"mutation"}],supports_tool_calls:true},limits:{max_memory_hits:0,max_inbox_items:0},include_inbox:false}}}')"
          bootstrap_outer="$(curl -fsS -X POST "$RPC" -H 'content-type: application/json' -H 'accept: application/json' --data "$bootstrap_payload")"
          context="$(echo "$bootstrap_outer" | jq -c '.result.content[0].text | fromjson')"
          echo "$context" | jq -e '
            .ok == true and
            .schema == "cairnstone-agent-context-v1" and
            (.package_id | test("^sha256:[0-9a-f]{64}$")) and
            ((.capabilities.available_tools | index("cairnstone_health")) != null) and
            ((.capabilities.available_tools | index("cairnstone_commit_v2")) != null) and
            .policy.execution_authority == false and
            .policy.mutation_authority == false
          ' >/dev/null

          read_payload="$(jq -nc --argjson ctx "$context" '{jsonrpc:"2.0",id:7303,method:"tools/call",params:{name:"cairnstone_tool_policy_preview",arguments:{context_package:$ctx,tool_intent:{tool_id:"cairnstone_health",arguments:{},executed:false}}}}')"
          read_outer="$(curl -fsS -X POST "$RPC" -H 'content-type: application/json' -H 'accept: application/json' --data "$read_payload")"
          read_decision="$(echo "$read_outer" | jq -c '.result.content[0].text | fromjson')"
          echo "$read_decision" | jq -e '
            .ok == true and
            .schema == "cairnstone-tool-policy-decision-v1" and
            .decision == "allow" and
            .reason == "read_only_automatic" and
            .authorization_required == false and
            .execution.preview_only == true and
            .execution.can_execute_now == false and
            .execution.executed == false and
            .execution.tools_executed == 0 and
            .policy.model_intent_is_execution_authority == false and
            .policy.execution_authority == false and
            .policy.mutation_authority == false
          ' >/dev/null

          mutation_payload="$(jq -nc --argjson ctx "$context" '{jsonrpc:"2.0",id:7304,method:"tools/call",params:{name:"cairnstone_tool_policy_preview",arguments:{context_package:$ctx,tool_intent:{tool_id:"cairnstone_commit_v2",arguments:{chain:"cairnstone-v6-project-memory",author:"github-actions:v730-acceptance",content:"candidate-only"},executed:false}}}}')"
          mutation_outer="$(curl -fsS -X POST "$RPC" -H 'content-type: application/json' -H 'accept: application/json' --data "$mutation_payload")"
          mutation_decision="$(echo "$mutation_outer" | jq -c '.result.content[0].text | fromjson')"
          echo "$mutation_decision" | jq -e '
            .ok == true and
            .decision == "require_authorization" and
            .reason == "human_confirmation" and
            .authorization_required == true and
            .registry.risk_class == "mutation" and
            .execution.preview_only == true and
            .execution.can_execute_now == false and
            .execution.executed == false and
            .execution.tools_executed == 0 and
            .policy.mutation_authority == false
          ' >/dev/null

          after="$(curl -fsS "$BASE/v2/chains/cairnstone-v6-project-memory/resume")"
          after_head="$(echo "$after" | jq -r '.canonical_head.hash')"
          after_paths="$(echo "$after" | jq -c '.path_heads | map({path,stone_hash}) | sort_by(.path)')"
          test "$before_head" = "$after_head"
          test "$before_paths" = "$after_paths"

          echo "V7.3.0 live acceptance passed: registry normalization, automatic-read eligibility, mutation authorization boundary, zero tool execution, and accepted-state immutability all verified."

      - name: V7.3.2 mutation authorization stop-boundary live acceptance
        if: github.event.inputs.run_v732_acceptance == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://cairnstone-v6.jaredtechfit.workers.dev"
          RPC="$BASE/mcp"
          CANDIDATE_PATH="project-memory/SHOULD-NOT-EXIST-v732-${GITHUB_RUN_ID}.txt"

          health="$(curl -fsS "$BASE/health")"
          echo "$health" | jq -e '
            .ok == true and
            .version == "0.5.11" and
            ((.mcp_tools | index("cairnstone_tool_execute")) != null) and
            ((.mcp_tools | index("cairnstone_tool_authorization_request")) != null)
          ' >/dev/null

          before="$(curl -fsS "$BASE/v2/chains/cairnstone-v6-project-memory/resume")"
          before_head="$(echo "$before" | jq -r '.canonical_head.hash')"
          before_paths="$(echo "$before" | jq -c '.path_heads | map({path,stone_hash}) | sort_by(.path)')"
          test -n "$before_head"

          bootstrap_payload="$(jq -nc '{jsonrpc:"2.0",id:7321,method:"tools/call",params:{name:"cairnstone_agent_bootstrap",arguments:{actor_id:"github-actions:v732-acceptance",task:"Propose a mutation but stop at the V7.3.2 authorization boundary. Do not execute it.",chain:"cairnstone-v6-project-memory",capabilities:{tools:[{id:"cairnstone_commit_v2",available:true,class:"mutation"}],supports_tool_calls:true},limits:{max_memory_hits:0,max_inbox_items:0},include_inbox:false}}}')"
          bootstrap_outer="$(curl -fsS -X POST "$RPC" -H 'content-type: application/json' -H 'accept: application/json' --data "$bootstrap_payload")"
          context="$(echo "$bootstrap_outer" | jq -c '.result.content[0].text | fromjson')"
          echo "$context" | jq -e '
            .ok == true and
            .schema == "cairnstone-agent-context-v1" and
            (.package_id | test("^sha256:[0-9a-f]{64}$")) and
            ((.capabilities.available_tools | index("cairnstone_commit_v2")) != null) and
            .policy.execution_authority == false and
            .policy.mutation_authority == false
          ' >/dev/null

          auth_payload="$(jq -nc --argjson ctx "$context" --arg path "$CANDIDATE_PATH" '{jsonrpc:"2.0",id:7322,method:"tools/call",params:{name:"cairnstone_tool_authorization_request",arguments:{context_package:$ctx,request_ir_id:("sha256:" + ("a" * 64)),model:{provider:"workers-ai",model:"v732-live-fixture"},turn_id:"turn:v732-live",justification:"Live acceptance candidate only; explicit authorization is intentionally absent.",tool_intent:{intent_id:("sha256:" + ("b" * 64)),tool_id:"cairnstone_commit_v2",arguments:{chain:"cairnstone-v6-project-memory",author:"github-actions:v732-acceptance",content:"THIS CANDIDATE MUST NEVER BE WRITTEN BY V7.3.2",path:$path,set_path_head:true},executed:false}}}}')"
          auth_outer="$(curl -fsS -X POST "$RPC" -H 'content-type: application/json' -H 'accept: application/json' --data "$auth_payload")"
          auth="$(echo "$auth_outer" | jq -c '.result.content[0].text | fromjson')"
          echo "$auth" | jq -e --arg path "$CANDIDATE_PATH" '
            .ok == true and
            .schema == "cairnstone-tool-authorization-request-v1" and
            .request_created == true and
            .decision == "require_authorization" and
            .reason == "human_confirmation" and
            .authorization_required == true and
            .required_authorization == "human_confirmation" and
            (.authorization_request_id | test("^sha256:[0-9a-f]{64}$")) and
            (.decision_id | test("^sha256:[0-9a-f]{64}$")) and
            .authorization_request.status == "pending" and
            .authorization_request.authorization.required == true and
            .authorization_request.authorization.status == "pending" and
            .authorization_request.authorization.consumed == false and
            .authorization_request.target.tool_id == "cairnstone_commit_v2" and
            .authorization_request.target.arguments.path == $path and
            .execution.can_execute_now == false and
            .execution.executed == false and
            .execution.tools_executed == 0 and
            .execution.target_tool_invoked == false and
            .execution.target_mutation_performed == false and
            .policy.execution_authority == false and
            .policy.mutation_authority == false and
            .policy.authorization_consumed == false and
            .policy.target_mutation_performed == false and
            .receipt.chain == "cairnstone-v7-tool-authorization-requests" and
            (.receipt.stone_hash | test("^[0-9a-f]{64}$"))
          ' >/dev/null

          AUTH_STONE="$(echo "$auth" | jq -r '.receipt.stone_hash')"
          persisted_payload="$(jq -nc --arg hash "$AUTH_STONE" '{jsonrpc:"2.0",id:7323,method:"tools/call",params:{name:"cairnstone_get_stone",arguments:{hash:$hash}}}')"
          persisted_outer="$(curl -fsS -X POST "$RPC" -H 'content-type: application/json' -H 'accept: application/json' --data "$persisted_payload")"
          persisted="$(echo "$persisted_outer" | jq -c '.result.content[0].text | fromjson')"
          echo "$persisted" | jq -e '
            .ok == true and
            .stone.border.chain == "cairnstone-v7-tool-authorization-requests" and
            .stone.metadata.type == "tool-authorization-request" and
            .stone.metadata.status == "pending" and
            .stone.metadata.tool_id == "cairnstone_commit_v2" and
            .stone.metadata.required_authorization == "human_confirmation"
          ' >/dev/null

          execute_payload="$(jq -nc --argjson ctx "$context" --arg path "$CANDIDATE_PATH" '{jsonrpc:"2.0",id:7324,method:"tools/call",params:{name:"cairnstone_tool_execute",arguments:{context_package:$ctx,tool_intent:{tool_id:"cairnstone_commit_v2",arguments:{chain:"cairnstone-v6-project-memory",author:"github-actions:v732-acceptance",content:"THIS CANDIDATE MUST NEVER BE WRITTEN BY V7.3.2",path:$path,set_path_head:true},executed:false}}}}')"
          execute_outer="$(curl -fsS -X POST "$RPC" -H 'content-type: application/json' -H 'accept: application/json' --data "$execute_payload")"
          execute="$(echo "$execute_outer" | jq -c '.result.content[0].text | fromjson')"
          echo "$execute" | jq -e '
            .ok == true and
            .executed == false and
            .decision == "require_authorization" and
            .authorization_required == true and
            .execution.can_execute_now == false and
            .execution.executed == false and
            .execution.tools_executed == 0 and
            .receipt == null
          ' >/dev/null

          bypass_payload="$(jq -nc --argjson ctx "$context" '{jsonrpc:"2.0",id:7325,method:"tools/call",params:{name:"cairnstone_tool_authorization_request",arguments:{context_package:$ctx,confirmed:true,tool_intent:{tool_id:"cairnstone_commit_v2",arguments:{},executed:false}}}}')"
          bypass_outer="$(curl -fsS -X POST "$RPC" -H 'content-type: application/json' -H 'accept: application/json' --data "$bypass_payload")"
          bypass="$(echo "$bypass_outer" | jq -c '.result.content[0].text | fromjson')"
          echo "$bypass" | jq -e '.ok == false and .error == "authorization_bypass_not_accepted" and .field == "confirmed"' >/dev/null

          after="$(curl -fsS "$BASE/v2/chains/cairnstone-v6-project-memory/resume")"
          after_head="$(echo "$after" | jq -r '.canonical_head.hash')"
          after_paths="$(echo "$after" | jq -c '.path_heads | map({path,stone_hash}) | sort_by(.path)')"
          test "$before_head" = "$after_head"
          test "$before_paths" = "$after_paths"
          if echo "$after" | jq -e --arg path "$CANDIDATE_PATH" '.path_heads | any(.path == $path)' >/dev/null; then
            echo "V7.3.2 failure: candidate mutation path unexpectedly entered accepted project state" >&2
            exit 1
          fi

          echo "V7.3.2 live acceptance passed: a real mutation proposal produced a durable pending human-confirmation request, both authorization-request and execution surfaces performed zero target mutation, bypass fields were rejected, and accepted project state was unchanged."
