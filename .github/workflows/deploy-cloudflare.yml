          workers_outer="$(curl -fsS -X POST "$RPC" -H 'content-type: application/json' -H 'accept: application/json' --data "$workers_payload")"
          workers="$(echo "$workers_outer" | jq -c '.result.content[0].text | fromjson')"
          echo "$workers" | jq -c '{checkpoint:"workers_route",ok,error,detail,package_id,request_ir_id,route,policy,attempts:(.attempts//.observability.attempts//null),diagnostic:(.diagnostic//null)}'
          CHECKPOINT="workers_assert"
          echo "$workers" | jq -e --arg package "$package_id" '
            .ok == true and .package_id == $package and .route.provider == "workers-ai" and
            .policy.tool_intents_only == true and .policy.execution_authority == false and .policy.mutation_authority == false
          ' >/dev/null
          request_ir_id="$(echo "$workers" | jq -r '.request_ir_id')"

          CHECKPOINT="deepseek_route"
