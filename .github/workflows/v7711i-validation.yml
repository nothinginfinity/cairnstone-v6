name: V7.7.11i feature validation

on:
  push:
    branches:
      - v7711i-stone-inspector
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: V7.7.11i targeted regression tests
        shell: bash
        run: |
          set +e
          node --test test/object-inspector.test.js test/model-router.test.js test/tool-catalog.test.js > /tmp/v7711i-targeted.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            cat /tmp/v7711i-targeted.log
            exit "$status"
          fi
          tail -n 18 /tmp/v7711i-targeted.log

      - name: Full repository checks
        shell: bash
        run: |
          set +e
          npm run check > /tmp/v7711i-check.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Full check failed; compact failure markers:"
            grep -n -E 'not ok|failureType:|location:|Expected values|ERR_ASSERTION|# tests |# pass |# fail |Error:' /tmp/v7711i-check.log || true
            exit "$status"
          fi
          tail -n 40 /tmp/v7711i-check.log
