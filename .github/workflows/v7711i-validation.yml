name: V7.7.11i feature validation

on:
  push:
    branches:
      - v7711i-stone-inspector
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Full repository checks
        run: npm run check

      - name: V7.7.11i targeted inspector tests
        run: node --test test/object-inspector.test.js
